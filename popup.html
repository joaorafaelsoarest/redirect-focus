<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Redirect Focus</title></head>
  <body class="popup">
    <main aria-labelledby="popup-title">
      <p class="eyebrow">Redirect Focus</p><h1 id="popup-title">Seu foco, com gentileza.</h1>
      <p id="protection-status" class="status" role="status">Carregando…</p>
      <section class="stats" aria-label="Redirecionamentos"><div><strong id="today-total">0</strong><span>hoje</span></div><div><strong id="week-total">0</strong><span>nos últimos 7 dias</span></div></section>
      <button id="open-options" type="button">Abrir configurações</button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
