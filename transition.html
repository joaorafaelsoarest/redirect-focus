<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Um respiro para o foco</title></head>
  <body class="transition">
    <main aria-labelledby="transition-title">
      <p class="eyebrow">Redirect Focus</p>
      <h1 id="transition-title">Você escolheu voltar ao que importa.</h1>
      <p>Em <strong id="countdown">5</strong> segundos, vamos para <span id="destination">seu próximo destino</span>. Ou escolha um destino para ir agora:</p>
      <section class="transition-destinations" aria-labelledby="destination-choices-title">
        <h2 id="destination-choices-title">Destinos produtivos</h2>
        <ul id="destination-choices" class="destination-choices"></ul>
      </section>
      <p id="transition-status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="transition.js"></script>
  </body>
</html>
