<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Configurações — Redirect Focus</title></head>
  <body>
    <main class="settings" aria-labelledby="page-title">
      <p class="eyebrow">Redirect Focus</p><h1 id="page-title">Proteja seu tempo</h1><p class="intro">Escolha o que interromper e para onde voltar. Nada do que você navega é salvo.</p>
      <p id="settings-status" class="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="blocked-heading"><h2 id="blocked-heading">Domínios que interrompem</h2><p>Você autoriza cada domínio apenas quando salvar.</p>
        <form id="blocked-form" class="inline-form"><label for="blocked-input">Domínio</label><input id="blocked-input" name="blocked" placeholder="ex.: instagram.com" autocomplete="off"><button>Adicionar</button></form>
        <div class="suggestions" aria-label="Sugestões de distração"><span>Sugestões:</span><button type="button" data-blocked="facebook.com">Facebook</button><button type="button" data-blocked="instagram.com">Instagram</button><button type="button" data-blocked="tiktok.com">TikTok</button><button type="button" data-blocked="x.com">X</button></div>
        <ul id="blocked-list" class="item-list" aria-label="Domínios bloqueados"></ul>
      </section>
      <section aria-labelledby="productive-heading"><h2 id="productive-heading">Destinos produtivos</h2><p>É necessário pelo menos um para ativar a proteção.</p>
        <form id="productive-form" class="inline-form"><label for="productive-input">URL</label><input id="productive-input" name="productive" placeholder="https://exemplo.com" autocomplete="off"><button>Adicionar</button></form>
        <div class="suggestions" aria-label="Sugestões de destino"><span>Sugestões:</span><button type="button" data-productive="https://trello.com">Trello</button><button type="button" data-productive="https://substack.com">Substack</button></div>
        <ol id="productive-list" class="item-list" aria-label="Ordem dos destinos produtivos"></ol>
      </section>
      <div class="actions"><button id="save" type="button">Salvar e ativar</button><label for="pause-minutes">Pausar por</label><select id="pause-minutes"><option value="15">15 minutos</option><option value="30">30 minutos</option><option value="60">60 minutos</option></select><button id="pause" type="button" class="secondary">Pausar</button><button id="resume" type="button" class="secondary">Retomar agora</button></div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
